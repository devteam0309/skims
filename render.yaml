# Render Blueprint for the SKIMS backend (Express API).
# Deploy via Render Dashboard -> New -> Blueprint, pointed at this repo.
# Secrets are marked `sync: false` so Render prompts you to enter them in the dashboard
# instead of reading them from this committed file.

services:
  - type: web
    name: skims-api
    runtime: node
    region: singapore          # closest Render region to the Philippines
    plan: free                 # NOTE: free tier sleeps after ~15 min idle; in-process cron jobs
                               # (deadline reminders / compliance checks) will not fire while asleep.
                               # Upgrade to a paid instance to keep them reliable.
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRE
        value: 15m
      - key: MAX_FILE_SIZE
        value: "10485760"
      - key: FROM_NAME
        value: SKIMS Platform
      # --- Generated automatically by Render (strong random secret) ---
      - key: JWT_SECRET
        generateValue: true
      # --- Enter these in the Render dashboard (sync:false keeps them out of git) ---
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL            # your Netlify site URL, e.g. https://skims.netlify.app
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Email. Render's free tier BLOCKS outbound SMTP (25/465/587), so nodemailer hangs until
      # timeout and nothing is delivered. RESEND_API_KEY switches the app to Resend's HTTP API,
      # which is not port-restricted — set it, or email is non-functional on this plan.
      - key: RESEND_API_KEY
        sync: false
      # Only needed until a sending domain is verified at resend.com/domains. With
      # FROM_EMAIL=onboarding@resend.dev, Resend delivers ONLY to the account owner's address;
      # RESEND_TO redirects all mail there. Remove it once a real domain is verified.
      - key: RESEND_TO
        sync: false
      # SMTP fallback, used only when RESEND_API_KEY is unset.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Must be on a Resend-verified domain when using Resend. Use onboarding@resend.dev until then.
      - key: FROM_EMAIL
        sync: false
